name: Bug report
description: Report a reproducible problem
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the control or action, expected behavior, and actual result. Do not include private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS, and viewport
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized console errors
